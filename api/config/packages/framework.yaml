# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    http_client:
        scoped_clients:
            inaturalist.client:
                base_uri: "https://api.inaturalist.org/v1/"
                timeout: 5
                headers:
                    User-Agent: "Fauneflore (%env(APP_URL)%)"
            photon.client:
                base_uri: "https://photon.komoot.io/"
                timeout: 5
                headers:
                    User-Agent: "Fauneflore (%env(APP_URL)%)"
            wikipedia.client:
                base_uri: "https://fr.wikipedia.org/api/rest_v1/"
                timeout: 5
                headers:
                    User-Agent: "Fauneflore (%env(APP_URL)%)"

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
