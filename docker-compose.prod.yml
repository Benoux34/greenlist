# Production stack for a single VPS, next to redlist.
#
# Nothing is published on a public interface: the web container is bound to
# 127.0.0.1 and the host's nginx (TLS) is what faces the internet.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

name: greenlist-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
    volumes:
      - jwt:/app/config/jwt

  web:
    build: ./front
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"

volumes:
  pgdata:
  jwt:
