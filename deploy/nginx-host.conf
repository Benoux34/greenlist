# TLS terminator, to install on the VPS itself (not in a container):
#
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/greenlist
#   sudo ln -s /etc/nginx/sites-available/greenlist /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d greenlist.dedyn.io
#   sudo certbot --nginx -d nature.redlist.dedyn.io
#
# Certbot adds the 443 servers, the certificate paths and the https redirect to
# the installed copy on its own. Application headers (CSP, cache policy) live
# in the web container, not here.

server {
    listen 80;
    listen [::]:80;
    server_name greenlist.dedyn.io;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Set from the socket address, so a client-supplied value is discarded.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}

# Former address, kept while links and bookmarks move over: every request goes
# to the same path on the new domain. Remove it (and its certificate) once the
# old domain is deleted on deSEC.
server {
    listen 80;
    listen [::]:80;
    server_name nature.redlist.dedyn.io;

    server_tokens off;

    return 301 https://greenlist.dedyn.io$request_uri;
}
