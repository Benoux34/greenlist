name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No environment file is versioned, so the checks get throwaway values
    # here. None of them is used outside this job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?serverVersion=16&charset=utf8
      APP_ENV: dev
      APP_SECRET: ci
      APP_SHARE_DIR: var/share
      DEFAULT_URI: http://localhost
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ci
      APP_URL: http://localhost
      MAILER_DSN: null://null

    steps:
      - uses: actions/checkout@v5

      # Symfony refuses to boot without its environment file, even an empty one.
      - run: touch api/.env

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer install --no-progress --prefer-dist
        working-directory: api

      - run: php bin/console lint:container
        working-directory: api

      - run: php bin/console lint:yaml config
        working-directory: api

      - name: Apply migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: api

      - name: Check migrations match the entities
        run: php bin/console doctrine:schema:validate
        working-directory: api

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
        working-directory: front

      # Runs the type-check and the production build.
      - run: npm run build
        working-directory: front

  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No environment file is versioned, so the checks get throwaway values
    # here. None of them is used outside this job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?serverVersion=16&charset=utf8
      APP_ENV: test
      APP_SECRET: ci
      APP_SHARE_DIR: var/share
      DEFAULT_URI: http://localhost
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ci
      APP_URL: http://localhost
      MAILER_DSN: null://null

    steps:
      - uses: actions/checkout@v5

      # Symfony refuses to boot without its environment file, even an empty one.
      - run: touch api/.env

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer install --no-progress --prefer-dist
        working-directory: api

      - name: Generate the JWT key pair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        working-directory: api

      # Unit and functional tests, in tests/api. The test database is built
      # by the migrations; iNaturalist, Photon and Wikipedia are faked.
      - run: composer test
        working-directory: api

  front-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
        working-directory: front

      # Unit and component tests, in tests/front.
      - run: npm test
        working-directory: front

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No environment file is versioned, so the checks get throwaway values
    # here. None of them is used outside this job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?serverVersion=16&charset=utf8
      APP_ENV: test
      APP_SECRET: ci
      APP_SHARE_DIR: var/share
      DEFAULT_URI: http://localhost
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ci
      APP_URL: http://localhost
      MAILER_DSN: null://null

    steps:
      - uses: actions/checkout@v5

      # Symfony refuses to boot without its environment file, even an empty one.
      - run: touch api/.env

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer install --no-progress --prefer-dist
        working-directory: api

      - name: Generate the JWT key pair
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        working-directory: api

      - name: Create the test database
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: api

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            tests/e2e/package-lock.json

      - run: npm ci
        working-directory: front

      - run: npm ci
        working-directory: tests/e2e

      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      # Starts the API (test environment) and the front, then runs the
      # journeys of tests/e2e on a desktop and a phone.
      - run: npm test
        working-directory: tests/e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: front
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [check, api-tests, front-tests, e2e, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # The key is restricted on the VPS to deploy/deploy.sh (command= in
      # authorized_keys), so opening the session is what runs the deployment.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          set -euo pipefail

          for name in SSH_KEY KNOWN_HOSTS TARGET; do
            if [ -z "${!name:-}" ]; then
              echo "!! Secret DEPLOY_$name is empty or missing." >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "$TARGET"
