name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No environment file is versioned, so the checks get throwaway values
    # here. None of them is used outside this job.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?serverVersion=16&charset=utf8
      APP_ENV: dev
      APP_SECRET: ci
      APP_SHARE_DIR: var/share
      DEFAULT_URI: http://localhost
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: ci
      APP_URL: http://localhost
      REDLIST_URL: http://localhost
      REDLIST_CLIENT_ID: ""

    steps:
      - uses: actions/checkout@v5

      # Symfony refuses to boot without its environment file, even an empty one.
      - run: touch api/.env

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer install --no-progress --prefer-dist
        working-directory: api

      - run: php bin/console lint:container
        working-directory: api

      - run: php bin/console lint:yaml config
        working-directory: api

      - name: Apply migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction
        working-directory: api

      - name: Check migrations match the entities
        run: php bin/console doctrine:schema:validate
        working-directory: api

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
        working-directory: front

      # Runs the type-check and the production build.
      - run: npm run build
        working-directory: front

  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: front
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [check, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # The key is restricted on the VPS to deploy/deploy.sh (command= in
      # authorized_keys), so opening the session is what runs the deployment.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          set -euo pipefail

          for name in SSH_KEY KNOWN_HOSTS TARGET; do
            if [ -z "${!name:-}" ]; then
              echo "!! Secret DEPLOY_$name is empty or missing." >&2
              exit 1
            fi
          done

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "$TARGET"
